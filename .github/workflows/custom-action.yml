
name: Custom Action Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Run custom greeting action
        id: greeting
        uses: Ahmad-Tariq-1/hello-world-action@v1.0.1
        with:
          name: Student

      - name: Display action output
        env:
          GREETING: ${{ steps.greeting.outputs.greeting }}
        run: 'echo "Output: $GREETING"'
