
name: Matrix Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Show matrix combination
        run: echo "OS=${{ matrix.os }} Python=${{ matrix.python-version }}"
