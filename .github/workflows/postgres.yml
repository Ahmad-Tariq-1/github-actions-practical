
name: PostgreSQL Service Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  database-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: student
          POSTGRES_PASSWORD: studentpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check PostgreSQL connection
        env:
          PGPASSWORD: studentpass
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U student -d testdb -c "SELECT version();"
          psql -h localhost -U student -d testdb -c "CREATE TABLE students (id INT, name TEXT);"
          psql -h localhost -U student -d testdb -c "INSERT INTO students VALUES (1, 'Demo Student');"
          psql -h localhost -U student -d testdb -c "SELECT * FROM students;"
